<audio id="bgm" src="bgm 2.mp3" loop preload="auto"></audio>
<button class="music-btn" id="musicBtn">🎁</button>
<script>
var bgm=document.getElementById('bgm');var btn=document.getElementById('musicBtn');var started=false;
function tryPlay(){bgm.play().then(function(){started=true;btn.textContent='🎉';}).catch(function(){});}
document.addEventListener('click',function(){if(!started) tryPlay();});
document.addEventListener('touchstart',function(){if(!started) tryPlay();});
btn.addEventListener('click',function(e){e.stopPropagation();if(bgm.paused){bgm.play();btn.textContent='🎉';}else{bgm.pause();btn.textContent='🎁';}});
tryPlay();
</script>
